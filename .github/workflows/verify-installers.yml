name: Verify installers

on:
  workflow_dispatch:
  pull_request:
    paths:
      - install.sh
      - install.ps1
      - scripts/build-pages.sh
      - scripts/verify-installer-source.sh
      - scripts/verify-live-installers.sh
      - site/**
      - wrangler.toml
      - .github/workflows/verify-installers.yml
  push:
    branches:
      - main
    paths:
      - install.sh
      - install.ps1
      - scripts/build-pages.sh
      - scripts/verify-installer-source.sh
      - scripts/verify-live-installers.sh
      - site/**
      - wrangler.toml
      - .github/workflows/verify-installers.yml

permissions:
  contents: read

concurrency:
  group: verify-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Verify source and build output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: scripts/verify-installer-source.sh

  deploy:
    name: Deploy production Worker
    if: github.event_name != 'pull_request'
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build static installer bundle
        run: scripts/build-pages.sh
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          wranglerVersion: "4.127.1"

  production:
    name: Verify production deployment
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify live Worker assets
        env:
          MAX_ATTEMPTS: "30"
          RETRY_SECONDS: "20"
        run: scripts/verify-live-installers.sh
